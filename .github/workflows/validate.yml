name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate native packages
        run: python3 scripts/validate.py
      - name: Build release assets
        run: python3 scripts/package-release.py
      - name: Validate generated adapters
        run: python3 scripts/validate.py --dist
      - name: Verify release asset set
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("core/spec.json"))["version"])')"
          test -f "dist/releases/adaptive-engineering-cursor-v${version}.zip"
          test -f "dist/releases/adaptive-engineering-agent-plugin-v${version}.zip"
          test -f "dist/releases/adaptive-engineering-antigravity-v${version}.zip"
          test -f "dist/releases/adaptive-engineering-opencode-v${version}.zip"
          test -f dist/releases/SHA256SUMS.txt
          (cd dist/releases && sha256sum --check SHA256SUMS.txt)
      - name: Test Antigravity plugin installation layout
        run: |
          adaptive_test_root="$(mktemp -d)"
          adaptive_plugin_target="$adaptive_test_root/.gemini/config/plugins/adaptive-engineering"
          mkdir -p "$adaptive_plugin_target"
          cp -a dist/antigravity/adaptive-engineering/. "$adaptive_plugin_target/"
          test -f "$adaptive_plugin_target/plugin.json"
          test -f "$adaptive_plugin_target/skills/adaptive-engineering/SKILL.md"
          test -f "$adaptive_plugin_target/agents/architect.md"
          test -f "$adaptive_plugin_target/rules/adaptive-engineering.md"
          test -f "$adaptive_plugin_target/core/PRINCIPLES.md"
      - name: Test Cursor install and uninstall
        run: |
          test_root="$(mktemp -d)"
          export ADAPTIVE_ENGINEERING_CURSOR_PLUGIN_ROOT="$test_root/plugins"
          ./scripts/install-local.sh
          test -f "$ADAPTIVE_ENGINEERING_CURSOR_PLUGIN_ROOT/adaptive-engineering/.cursor-plugin/plugin.json"
          ./scripts/uninstall-local.sh
          test ! -e "$ADAPTIVE_ENGINEERING_CURSOR_PLUGIN_ROOT/adaptive-engineering"
