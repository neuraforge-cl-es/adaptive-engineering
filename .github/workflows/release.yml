name: Release assets

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only to upload release assets.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python3 -c 'import json; print(json.load(open("core/spec.json"))["version"])')"
          expected_tag="v${package_version}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf 'Release tag %q does not match core/spec.json version %q\n' "$RELEASE_TAG" "$expected_tag" >&2
            exit 1
          fi

      - name: Validate source package
        run: python3 scripts/validate.py

      - name: Build release assets
        run: python3 scripts/package-release.py

      - name: Validate generated adapters
        run: python3 scripts/validate.py --dist

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/releases/*.zip \
            dist/releases/SHA256SUMS.txt \
            --clobber
